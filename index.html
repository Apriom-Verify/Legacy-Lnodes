<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy Lnodes Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.9);
            --accent-green: #3fb950;
            --accent-gold: #f0b429;
            --accent-blue: #58a6ff;
            --text-color: #c9d1d9;
            --border-color: rgba(240, 180, 41, 0.2);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .node-badge {
            background: #21262d;
            padding: 6px 12px;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            border: 1px solid #30363d;
        }

        .device-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .device-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #161b22;
            color: var(--text-color);
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .device-btn.active {
            background: linear-gradient(135deg, #f0b429, #d29922);
            color: #0b0f19;
        }

        .channel-card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .channel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .channel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            color: #fff;
        }

        .dot-on {
            height: 9px;
            width: 9px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .dot-off {
            height: 9px;
            width: 9px;
            background-color: #f85149;
            border-radius: 50%;
            display: inline-block;
        }

        .status-badge {
            background: #21262d;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid #30363d;
        }

        .metric-box {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 8px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: #8b949e;
            margin-bottom: 3px;
        }

        .metric-val {
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
        }

        .metric-val.green {
            color: var(--accent-green);
        }

        .sub-accruing {
            font-size: 0.75rem;
            color: #8b949e;
            margin-top: 2px;
        }

        .summary-box {
            background: linear-gradient(145deg, #161b22, #0d1117);
            border: 1px solid var(--accent-gold);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 1.3rem;">⚡</span>
            <span class="node-badge">Legacy Lnodes</span>
        </div>
        <div id="btcLivePriceTxt" style="font-size: 0.85rem; color: var(--accent-gold);">BTC: بارگذاری...</div>
    </div>

    <!-- دکمه‌های جابجایی بین دو دستگاه -->
    <div class="device-selector">
        <div class="device-btn active" id="btn-dev1" onclick="switchDevice('device_1')">دستگاه اول (Device 1)</div>
        <div class="device-btn" id="btn-dev2" onclick="switchDevice('device_2')">دستگاه دوم (Device 2)</div>
    </div>

    <!-- مجموع کل درآمد -->
    <div class="summary-box">
        <div style="color: var(--accent-gold); font-weight: bold; margin-bottom: 8px;">📊 مجموع کل درآمد این دستگاه</div>
        <div style="display: flex; justify-content: space-around; font-size: 0.9rem;">
            <div>روزانه: <span id="sumDaily" style="color: var(--accent-green); font-weight: bold;">0</span> sats</div>
            <div>ماهانه: <span id="sumMonthly" style="color: var(--accent-blue); font-weight: bold;">0</span> sats</div>
        </div>
    </div>

    <!-- لیست کانال‌ها -->
    <div id="channels-container"></div>

    <script>
        let currentBtcPrice = 80415;
        let allData = {};
        let activeDevice = 'device_1';

        async function loadData() {
            try {
                const response = await fetch('devices_data.json');
                allData = await response.json();
                renderDevice(activeDevice);
            } catch (e) {
                console.log("خطا در بارگذاری اطلاعات");
            }
        }

        function switchDevice(dev) {
            activeDevice = dev;
            document.getElementById('btn-dev1').classList.toggle('active', dev === 'device_1');
            document.getElementById('btn-dev2').classList.toggle('active', dev === 'device_2');
            renderDevice(dev);
        }

        function renderDevice(dev) {
            const container = document.getElementById('channels-container');
            container.innerHTML = '';
            const channels = allData[dev] || [];

            let totalD = 0;
            let totalM = 0;

            channels.forEach(ch => {
                totalD += ch.dailySats;
                totalM += ch.monthlySats;

                const isOn = ch.status === 'On';
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <div class="channel-header">
                        <div class="channel-title">
                            <span class="${isOn ? 'dot-on' : 'dot-off'}"></span>
                            <span>${ch.name}</span>
                        </div>
                        <span class="status-badge" style="color: ${isOn ? 'var(--accent-green)' : '#f85149'}">${ch.status}</span>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">Revenue per active day</div>
                        <div class="metric-val">${ch.dailySats.toLocaleString()} sats</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">Revenue per 30 active days</div>
                        <div class="metric-val">${ch.monthlySats.toLocaleString()} sats</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">Claimable Earnings</div>
                        <div class="metric-val green">${ch.claimable.toLocaleString()} sats</div>
                        <div class="sub-accruing">Accruing + ${ch.accruing} sats</div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('sumDaily').innerText = totalD.toLocaleString();
            document.getElementById('sumMonthly').innerText = totalM.toLocaleString();
        }

        async function fetchBtcPrice() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
                const data = await res.json();
                if (data?.bitcoin?.usd) {
                    currentBtcPrice = data.bitcoin.usd;
                    document.getElementById('btcLivePriceTxt').innerText = `BTC: $${currentBtcPrice.toLocaleString()}`;
                }
            } catch (e) {
                console.log("خطا در قیمت بیت‌کوین");
            }
        }

        loadData();
        fetchBtcPrice();
        setInterval(fetchBtcPrice, 1000);
    </script>
</body>
</html>
